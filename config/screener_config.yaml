# Screener thresholds. Edit this file to add presets - no code changes needed.
# Each filter maps a name to a column and an operator (>=, <=). Financials skip filters marked skip_financials.
filters:
  min_roe:            {column: return_on_equity_pct,   op: ">="}
  min_roce:           {column: roce_pct,               op: ">=", skip_financials: true}
  min_npm:            {column: net_profit_margin_pct,  op: ">="}
  min_opm:            {column: operating_profit_margin_pct, op: ">=", skip_financials: true}
  max_de:             {column: debt_to_equity,         op: "<=", skip_financials: true}
  min_icr:            {column: interest_coverage,      op: ">=", skip_financials: true, null_passes: true}
  min_fcf:            {column: free_cash_flow_cr,      op: ">="}
  min_fcf_conversion: {column: fcf_conversion_pct,     op: ">="}
  min_rev_cagr_3y:    {column: revenue_cagr_3y,        op: ">="}
  min_rev_cagr_5y:    {column: revenue_cagr_5y,        op: ">="}
  min_pat_cagr_5y:    {column: pat_cagr_5y,            op: ">="}
  min_eps_cagr_5y:    {column: eps_cagr_5y,            op: ">="}
  max_pe:             {column: pe_ratio,               op: "<="}   # SIMULATED market data
  max_pb:             {column: pb_ratio,               op: "<="}   # SIMULATED market data
  max_ev_ebitda:      {column: ev_ebitda,              op: "<="}   # SIMULATED market data
  min_div_yield:      {column: dividend_yield_pct,     op: ">="}   # SIMULATED market data
  max_payout:         {column: dividend_payout_ratio_pct, op: "<="}
  min_sales_cr:       {column: sales_cr,               op: ">="}
presets:
  Quality Compounder:
    filters: {min_roe: 15, max_de: 1.0, min_fcf: 0, min_rev_cagr_5y: 10}
    rank_by: composite_score
  Value Pick:
    filters: {max_pe: 20, max_pb: 3.0, max_de: 2.0, min_div_yield: 1.0}
    rank_by: fcf_yield_pct
  Growth Accelerator:
    filters: {min_pat_cagr_5y: 20, min_rev_cagr_5y: 15, max_de: 2.0}
    rank_by: pat_cagr_5y
  Dividend Champion:
    filters: {min_div_yield: 2.0, max_payout: 80, min_fcf: 0}
    rank_by: dividend_yield_pct
  Debt-Free Blue Chip:
    filters: {max_de: 0.05, min_roe: 12, min_sales_cr: 5000}   # D/E <= 0.05 treated as debt-free
    no_financial_carveout: true   # banks/insurers must not pass a debt-free screen via the D/E carve-out
    rank_by: return_on_equity_pct
  Turnaround Watch:
    filters: {min_rev_cagr_3y: 10, min_fcf: 0}
    extra: de_declining          # D/E lower than previous year
    rank_by: revenue_cagr_3y
# Composite score weights (spec section 25.1)
composite_weights:
  profitability: {weight: 0.35, parts: {return_on_equity_pct: 0.15, roce_pct: 0.10, net_profit_margin_pct: 0.10}}
  cash_quality:  {weight: 0.30, parts: {fcf_cagr_5y: 0.15, cfo_to_pat: 0.10, fcf_positive: 0.05}}
  growth:        {weight: 0.20, parts: {revenue_cagr_5y: 0.10, pat_cagr_5y: 0.10}}
  leverage:      {weight: 0.15, parts: {de_score: 0.10, icr_score: 0.05}}
